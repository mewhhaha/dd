[workspace]
members = [
  "crates/api",
  "crates/cli",
  "crates/common",
  "crates/init",
  "crates/runtime",
  "crates/storage",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
arc-swap = "1.9.2"
base64 = "0.23.1"
deno_core = "0.412.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simd-json = { version = "0.18.1", features = ["serde_impl"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.0"
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[patch.crates-io]
deno_crypto = { path = "patched-crates/deno_crypto" }
deno_tls = { path = "patched-crates/deno_tls" }

[profile.dev-runtime]
inherits = "release"
codegen-units = 1
debug = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
debug = false
incremental = false
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
