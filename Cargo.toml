[workspace]
members = [
  "crates/api",
  "crates/cli",
  "crates/common",
  "crates/init",
  "crates/runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
arc-swap = "1"
base64 = "0.22"
deno_core = "0.408"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = { version = "0.17", features = ["serde_impl"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
uuid = { version = "1", features = ["serde", "v4"] }

[patch.crates-io]
deno_crypto = { path = "patched-crates/deno_crypto" }

[profile.dev-runtime]
inherits = "release"
codegen-units = 1
debug = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
debug = false
incremental = false
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
