[workspace]
members = [
  "crates/cli",
  "crates/common",
  "crates/init",
  "crates/storage",
  "crates/runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
wasmtime = { version = "47", default-features = false, features = ["runtime", "cranelift"] }

[profile.dist]
inherits = "release"
debug = false
incremental = false
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
