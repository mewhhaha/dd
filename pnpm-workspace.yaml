packages:
  - "packages/*"
  - "examples/*"

# Allow the explicitly selected stable Vite release through pnpm's age gate.
minimumReleaseAgeExclude:
  - vite@8.3.2

# Keep framework plugins and runtime entrypoints on the same stable release.
overrides:
  react-router: ">=8.4.0"
  "@react-router/dev": ">=8.4.0"
  "@react-router/node": ">=8.4.0"
  postcss: ">=8.5.28"
  valibot: ">=1.5.0"
  # Vitest browser packages require exactly the matching Vitest version.
  "@vitest/browser": ">=5.0.3"
  vitest: ">=5.0.3"
