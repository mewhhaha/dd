app = "dd-traces-8956e096"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  COLLECTOR_OTLP_ENABLED = "true"
  SPAN_STORAGE_TYPE = "memory"

# Intentionally no public service. Use Fly private networking or flyctl proxy.
[checks]
  [checks.jaeger_ui]
    type = "tcp"
    port = 16686
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
