name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  runtime-binaries:
    name: Runtime ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package: dd-runtime-linux-x64
            binary: dd_dev_runtime
          - runner: ubuntu-24.04-arm
            package: dd-runtime-linux-arm64
            binary: dd_dev_runtime
          - runner: macos-15-intel
            package: dd-runtime-darwin-x64
            binary: dd_dev_runtime
          - runner: macos-15
            package: dd-runtime-darwin-arm64
            binary: dd_dev_runtime
          - runner: windows-2025
            package: dd-runtime-win32-x64
            binary: dd_dev_runtime.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile dist -p runtime --bin dd_dev_runtime
      - name: Smoke binary
        shell: bash
        run: target/dist/${{ matrix.binary }} --help
      - name: Stage npm package
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.package }}/bin
          cp target/dist/${{ matrix.binary }} packages/${{ matrix.package }}/bin/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/dist/${{ matrix.binary }}

  linux-platform:
    name: Linux platform binaries and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile dist -p dd_server -p cli --no-default-features --features dd_server/websocket,dd_server/otel
      - run: target/dist/dd_server --help
      - run: target/dist/cli --help
      - uses: anchore/sbom-action@v0
        with:
          path: target/dist
          format: spdx-json
          output-file: dd-linux-x64.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dd-linux-platform
          path: |
            target/dist/dd_server
            target/dist/cli
            dd-linux-x64.spdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/dist/dd_server
            target/dist/cli

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [runtime-binaries, linux-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Archive release assets
        run: |
          mkdir release
          for directory in artifacts/dd-runtime-*; do
            name="$(basename "$directory")"
            tar -C "$directory" -czf "release/${name}.tar.gz" .
          done
          cp artifacts/dd-linux-platform/dd-linux-x64.spdx.json release/
          cp artifacts/dd-linux-platform/target/dist/dd_server release/dd-server-linux-x64
          cp artifacts/dd-linux-platform/target/dist/cli release/dd-cli-linux-x64
      - run: gh release upload "${GITHUB_REF_NAME}" release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: runtime-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Restore platform binaries
        run: |
          for directory in artifacts/dd-runtime-*; do
            package="$(basename "$directory")"
            rm -rf "packages/${package}"
            cp -R "$directory" "packages/${package}"
          done
      - name: Publish platform and selector packages
        run: |
          for package in packages/dd-runtime-{darwin-arm64,darwin-x64,linux-arm64,linux-x64,win32-x64}; do
            npm publish "$package" --provenance --access public
          done
          npm publish packages/dd-runtime --provenance --access public
          npm publish packages/dd-vite --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
