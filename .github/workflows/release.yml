name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Verify Rust, npm and release tag versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - run: node --test scripts/check-release-version.test.mjs
      - run: python3 scripts/test-release-artifacts.py

  runtime-binaries:
    needs: validate-release
    name: Runtime ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package: dd-runtime-linux-x64
            binary: dd_dev_runtime
          - runner: ubuntu-24.04-arm
            package: dd-runtime-linux-arm64
            binary: dd_dev_runtime
          - runner: macos-15-intel
            package: dd-runtime-darwin-x64
            binary: dd_dev_runtime
          - runner: macos-15
            package: dd-runtime-darwin-arm64
            binary: dd_dev_runtime
          - runner: windows-2025
            package: dd-runtime-win32-x64
            binary: dd_dev_runtime.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile dist -p dd_server --no-default-features --features websocket --bin dd_dev_runtime
      - name: Smoke binary
        shell: bash
        run: target/dist/${{ matrix.binary }} --help
      - name: Stage npm package
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.package }}/bin
          cp target/dist/${{ matrix.binary }} packages/${{ matrix.package }}/bin/${{ matrix.binary }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v4
        with:
          create-storage-record: false
          subject-path: target/dist/${{ matrix.binary }}

  linux-platform:
    needs: validate-release
    name: Linux platform binaries and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile dist -p dd_server -p cli --no-default-features --features dd_server/websocket,dd_server/otel
      - run: target/dist/dd_server --help
      - run: target/dist/cli --help
      - uses: anchore/sbom-action@v0
        with:
          path: target/dist
          format: spdx-json
          output-file: dd-linux-x64.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: dd-linux-platform
          path: |
            target/dist/dd_server
            target/dist/cli
            dd-linux-x64.spdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          create-storage-record: false
          subject-path: |
            target/dist/dd_server
            target/dist/cli

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [runtime-binaries, linux-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Archive release assets
        run: python3 scripts/package-release-artifacts.py --verify-linux
      - name: Create or verify the GitHub release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload "${GITHUB_REF_NAME}" release/* --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [runtime-binaries, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Restore platform binaries
        run: |
          for directory in artifacts/dd-runtime-*; do
            package="$(basename "$directory")"
            rm -rf "packages/${package}"
            cp -R "$directory" "packages/${package}"
            chmod 755 "packages/${package}/bin/"*
          done
      - name: Publish platform and selector packages
        run: |
          for package in packages/dd-runtime-{darwin-arm64,darwin-x64,linux-arm64,linux-x64,win32-x64}; do
            pnpm publish "$package" --provenance --access public --no-git-checks
          done
          pnpm publish packages/dd-runtime --provenance --access public --no-git-checks
          pnpm publish packages/dd-vite --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
