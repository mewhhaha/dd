name: Benchmarks

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      samples:
        description: Samples per benchmark variant
        default: "3"
        required: true
      allow_large_run:
        description: Allow plans over the default run budget
        default: "false"
        required: true

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-smoke:
    name: Memory smoke regression check
    runs-on: ubuntu-latest
    env:
      DD_BENCH_SAMPLES: ${{ inputs.samples || '3' }}
      DD_BENCH_ALLOW_LARGE_RUN: ${{ inputs.allow_large_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - name: Plan benchmark smoke matrix
        run: |
          DD_BENCH_MATRIX_ISOLATES="1 8" \
          DD_BENCH_MATRIX_MEMORY_NAMESPACE_SHARDS="8" \
          DD_BENCH_MATRIX_KEY_MODES="same-shard cross-shard" \
          DD_BENCH_MATRIX_MODES="direct-write-memory-wide atomic-readwrite-memory-wide" \
          node benchmarks/run.mjs --plan --samples "$DD_BENCH_SAMPLES" \
            --config scaling-atomic-memory-matrix.sh
      - name: Run benchmark smoke matrix
        run: |
          extra_flags=()
          if [ "$DD_BENCH_ALLOW_LARGE_RUN" = "true" ]; then
            extra_flags+=(--allow-large-run)
          fi
          DD_BENCH_MATRIX_ISOLATES="1 8" \
          DD_BENCH_MATRIX_MEMORY_NAMESPACE_SHARDS="8" \
          DD_BENCH_MATRIX_KEY_MODES="same-shard cross-shard" \
          DD_BENCH_MATRIX_MODES="direct-write-memory-wide atomic-readwrite-memory-wide" \
          node benchmarks/run.mjs --samples "$DD_BENCH_SAMPLES" \
            --config scaling-atomic-memory-matrix.sh \
            --out benchmarks/results/memory-smoke.json \
            "${extra_flags[@]}"
      - name: Check structural regression policy
        run: |
          set -o pipefail
          node benchmarks/check-regression.mjs \
            --results benchmarks/results/memory-smoke.json \
            --policy benchmarks/baselines/memory-scaling-policy.json \
            | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-smoke-benchmark
          path: benchmarks/results/memory-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  production-regression:
    name: HTTP, memory, storage, limiter, and multi-worker regression
    runs-on: ubuntu-latest
    env:
      DD_BENCH_SAMPLES: ${{ inputs.samples || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure benchmark target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/dd-benchmark-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scheduled-production-benchmarks
      - name: Create previous-commit worktree
        run: git worktree add --detach "${RUNNER_TEMP}/dd-baseline" HEAD^
      - name: Run previous-commit baseline
        working-directory: ${{ runner.temp }}/dd-baseline
        run: |
          node benchmarks/run.mjs --samples "$DD_BENCH_SAMPLES" \
            --config http1-server-front-cache.sh \
            --config focused-memory-read.sh \
            --config storage-memory-write-cross-shard.sh \
            --config realworld-rate-limiter.sh \
            --config realworld-multiworker-auth.sh \
            --out "${RUNNER_TEMP}/dd-baseline.json"
      - name: Run candidate
        run: |
          node benchmarks/run.mjs --samples "$DD_BENCH_SAMPLES" \
            --config http1-server-front-cache.sh \
            --config focused-memory-read.sh \
            --config storage-memory-write-cross-shard.sh \
            --config realworld-rate-limiter.sh \
            --config realworld-multiworker-auth.sh \
            --out "${RUNNER_TEMP}/dd-candidate.json"
      - name: Enforce 5% throughput and 10% p99 budgets
        run: |
          node benchmarks/compare-commits.mjs \
            --baseline "${RUNNER_TEMP}/dd-baseline.json" \
            --candidate "${RUNNER_TEMP}/dd-candidate.json" \
            | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-regression-benchmarks
          path: |
            ${{ runner.temp }}/dd-baseline.json
            ${{ runner.temp }}/dd-candidate.json
          if-no-files-found: ignore
          retention-days: 30
