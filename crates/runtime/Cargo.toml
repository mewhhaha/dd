[package]
name = "runtime"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
build = "build.rs"

[dependencies]
arc-swap.workspace = true
common = { path = "../common" }
storage = { path = "../storage" }
dd_v8 = { path = "../dd_v8" }
serde.workspace = true
serde_json.workspace = true
simd-json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
uuid.workspace = true
reqwest = { workspace = true, features = ["brotli", "deflate", "gzip"] }
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
sha2 = { version = "0.11.0", features = ["oid"] }
mime_guess = "2.0.5"
regex = "1.13.1"
encoding_rs = "0.8.35"
rustls = "0.23.45"
url = { workspace = true, features = ["expose_internals"] }
urlpattern = "=0.4.2"
# WebCrypto, ported from deno_crypto 0.253, on one major of the RustCrypto crates.
aes = "0.9.3"
aes-gcm = "0.11.1"
aes-kw = "0.3.1"
aws-lc-rs = "1.16.1"
cbc = { version = "0.2.1", features = ["alloc"] }
const-oid = "0.10.2"
ctr = "0.10.1"
curve25519-dalek = "5.0.0"
ecdsa = "0.17.0"
ed448-goldilocks = "0.14.0-pre.15"
elliptic-curve = { version = "0.14.1", features = ["alloc", "arithmetic", "ecdh", "pem", "std"] }
ocb3 = "0.2.0"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
p521 = { version = "0.14.0", features = ["ecdh"] }
rand = "0.10.3"
# rsa 0.9 would pull the previous RustCrypto major back in, and 0.10 has only
# release candidates so far, which may break each other.
rsa = "=0.10.0-rc.19"
serde_bytes = "0.11"
sha1 = { version = "0.11.0", features = ["oid"] }
sha3 = "0.12.0"
signature = "3.0.0"
spki = { version = "0.8.1", features = ["alloc"] }
thiserror.workspace = true
x25519-dalek = "3.0.0"

[features]
default = []
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry"]

[dev-dependencies]
serial_test.workspace = true
