[package]
name = "runtime"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
arc-swap.workspace = true
common = { path = "../common" }
deno_core.workspace = true
deno_error = "=0.7.1"
turso = { git = "https://github.com/tursodatabase/turso", rev = "f548e012cd6ef4ecc3d0f6112d69813e13c54dcb", default-features = false }
capnp = "0.26"
serde.workspace = true
serde_json.workspace = true
simd-json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
uuid.workspace = true
reqwest.workspace = true
getrandom = "0.4"
base64.workspace = true
bytes = "1"
futures-util = "0.3"
sha2 = "0.11"
mime_guess = "2"
regex = "1"
deno_webidl = "0.254.0"
deno_web = "0.285.0"
deno_fetch = "0.278.0"
deno_crypto = "0.268.0"
deno_permissions = "0.113.0"
rustls = "0.23"
sys_traits = { version = "0.1.28", features = ["real", "libc"] }

[features]
default = []
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry"]

[dev-dependencies]
serial_test = "3"
