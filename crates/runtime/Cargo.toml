[package]
name = "runtime"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
build = "build.rs"

[dependencies]
arc-swap.workspace = true
common = { path = "../common" }
storage = { path = "../storage" }
dd_v8 = { path = "../dd_v8" }
serde.workspace = true
serde_json.workspace = true
simd-json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
uuid.workspace = true
reqwest = { workspace = true, features = ["brotli", "deflate", "gzip"] }
getrandom = "0.4.3"
base64.workspace = true
bytes = "1.12.1"
futures-util = "0.3.34"
sha2 = "0.11.0"
mime_guess = "2.0.5"
regex = "1.13.1"
encoding_rs = "0.8.35"
rustls = "0.23.45"
url = { version = "2.5.8", features = ["expose_internals"] }
urlpattern = "=0.4.2"
# WebCrypto, ported from deno_crypto 0.253 with the versions it was written for.
aes = "0.8.4"
aes-gcm = "0.10"
aes-kw = { version = "0.2.1", features = ["alloc"] }
aws-lc-rs = "1.16.1"
cbc = { version = "0.1.2", features = ["alloc"] }
const-oid = "0.9.5"
ctr = { version = "0.9.2", features = ["alloc"] }
curve25519-dalek = "4.1.3"
ecdsa = "0.16.9"
ed448-goldilocks = "0.14.0-pre.10"
elliptic-curve = { version = "0.13.4", features = ["alloc", "arithmetic", "ecdh", "jwk", "pem", "std"] }
num-traits = "0.2.19"
ocb3 = "0.1.0"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa", "jwk"] }
p384 = { version = "0.13.0", features = ["ecdh", "ecdsa", "jwk"] }
p521 = { version = "0.13.3", features = ["ecdh", "jwk"] }
rand = "0.8.5"
rsa = { version = "0.9.9", default-features = false, features = ["hazmat", "pem", "std"] }
serde_bytes = "0.11"
sha1 = { version = "0.10.6", features = ["oid"] }
sha2_10 = { package = "sha2", version = "0.10.8", features = ["oid"] }
sha3 = "0.10.8"
signature = "2.1"
spki = "0.7.2"
thiserror.workspace = true
x25519-dalek = "2.0.0"

[features]
default = []
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry"]

[dev-dependencies]
serial_test = "4.0.1"
