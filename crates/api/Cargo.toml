[package]
name = "dd_server"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[dependencies]
base64.workspace = true
clap.workspace = true
bytes.workspace = true
common = { path = "../common" }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server", "tokio"] }
runtime = { path = "../runtime", default-features = false }
storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", optional = true }
futures-util = { workspace = true, features = ["sink"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
uuid.workspace = true
url.workspace = true

[features]
default = ["websocket", "otel"]
websocket = ["dep:tokio-tungstenite"]
otel = [
    "runtime/otel",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dev-dependencies]
serial_test.workspace = true

[[bin]]
name = "bench_http_server"
path = "src/bin/bench_http_server.rs"
required-features = ["otel"]
