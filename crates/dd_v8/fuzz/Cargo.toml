[package]
name = "dd_v8-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
dd_v8 = { path = ".." }
libfuzzer-sys = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.151"

# Not part of the dd workspace: cargo-fuzz builds this crate on its own,
# with sanitizer flags the rest of the workspace should not see.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "deserialize"
path = "fuzz_targets/deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde_roundtrip"
path = "fuzz_targets/serde_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "js_values"
path = "fuzz_targets/js_values.rs"
test = false
doc = false
bench = false
